<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Emergent Outreach CRM</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: nothing but the flow. People sit on the left as soft pills; thin curved arrows grow out of them
   to their panels, to each lead, then weave through the conversation: what we sent rides high and outlined,
   what they sent back rides low and filled. Editing happens in one floating panel. Single dark look by request. */
:root{
  --bg:#000;
  --fg:#fff;
  --dim:#8f8f8f;
  --faint:#565656;
  --hair:#2a2a2a;
  --wire:#d2d2d2;
  --halo:rgba(255,255,255,.13);
  --sheet:#0b0b0b;
  --ink-dim:#5c5c5c;
  --ok:#30d158;
  --no:#ff453a;
  --sans:"DM Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --drawer:380px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
.dim{color:var(--dim)}
.ic{display:inline-flex}
.ic svg{width:1em;height:1em;display:block}
.defs{position:absolute;width:0;height:0}
.ahp{fill:none;stroke:var(--wire);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}

.app{padding-inline:28px;padding-block:22px 90px;display:flex;flex-direction:column;gap:38px;min-width:0}
@media (min-width:1000px){body.has-drawer .app{margin-right:calc(var(--drawer) + 14px)}}
@media (max-width:480px){.app{padding-inline:16px}}

.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px}
.brand{font-weight:600;margin-right:auto}
.nav{display:flex;gap:20px}
.nav button{color:var(--dim)}
.nav button:hover,.nav button[aria-pressed="true"]{color:var(--fg)}
.status{font-size:12px;color:var(--dim)}
.status:empty{display:none}
#main{display:flex;flex-direction:column;gap:30px;min-width:0}
.quiet{color:var(--dim);max-width:52ch}
.add{color:var(--faint);font-size:13px;padding:5px 6px;border-radius:999px;align-self:flex-start;white-space:nowrap}
.add:hover{color:var(--fg)}
.foot{font-size:12px;color:var(--faint);display:flex;gap:8px;align-items:baseline}
.textbtn{font-size:12px;color:var(--dim);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.textbtn:hover{color:var(--fg)}
.textbtn.danger:hover,.textbtn.armed{color:var(--no);text-decoration-color:var(--no)}

/* opening screen */
.people{display:flex;flex-direction:column;gap:16px;width:min(100%,380px)}
.person{border:1px solid var(--fg);border-radius:30px;padding:15px 28px;display:flex;flex-direction:column;gap:3px;width:100%}
.person .nm{font-size:18px;font-weight:600;overflow-wrap:anywhere}
.person .sub{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.person:hover{box-shadow:0 0 0 5px var(--halo)}
.people .add{align-self:flex-start;padding:6px 28px}

/* the flow */
.scroller{overflow-x:auto;padding:8px 6px 14px;margin-inline:-6px}
.flow{position:relative;width:max-content;min-width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:46px}
.wires{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke:var(--wire);stroke-width:1}
.wires path.w-wait{stroke:var(--faint);stroke-dasharray:3 4}
.wires circle{fill:var(--bg);stroke:var(--faint);stroke-width:1}
.branch{display:flex;align-items:center;gap:64px}
.kids{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.chain{display:flex;align-items:center;gap:46px;padding-block:10px}
.node{position:relative;flex:none;display:flex;flex-direction:column;line-height:1.25;max-width:230px;background:var(--bg);border:1px solid var(--fg);border-radius:26px;padding:7px 17px}
.node:hover{box-shadow:0 0 0 4px var(--halo)}
.node.sel,.node.sel:hover{box-shadow:0 0 0 1px var(--fg),0 0 0 6px var(--halo)}
.node.member{padding:12px 24px;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.node.panel{border-color:transparent;padding:5px 9px;font-size:13px;color:var(--dim);max-width:170px;overflow-wrap:anywhere}
.node.panel:hover,.node.panel.sel{color:var(--fg)}
.node.panel.sel{box-shadow:0 0 0 5px var(--halo)}
.node.lead .nm{font-weight:600;overflow-wrap:anywhere}
.node .sub{font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.node.step{padding:6px 16px;white-space:nowrap}
.node.step .lbl{font-size:11px;color:var(--dim)}
.node.step .dt{font-size:13px;font-variant-numeric:tabular-nums}
.node.step.in{background:var(--fg);color:var(--bg)}
.node.step.in .lbl{color:var(--ink-dim)}
.up{top:-8px}
.down{top:8px}
.tail{position:relative;flex:none;display:flex;align-items:center;gap:11px;font-size:12px;color:var(--dim);border-radius:999px}
.tail .tip{flex:none;width:58px;height:30px;border-radius:999px}
.tail:hover .tip,.tail.sel .tip{background:var(--halo)}
.tail .note{max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tail:hover .note,.tail.sel .note{color:var(--fg)}
.tail.end{width:28px;height:28px;border:1px solid currentColor;display:grid;place-items:center;font-size:14px}
.tail.end:hover,.tail.end.sel{box-shadow:0 0 0 5px var(--halo)}
.tail.ok{color:var(--ok)}
.tail.no{color:var(--no)}

/* floating panel */
.drawer{position:fixed;z-index:10;top:calc(14px + env(safe-area-inset-top,0px));right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(var(--drawer),calc(100% - 28px));background:var(--sheet);border:1px solid var(--hair);border-radius:26px;display:flex;flex-direction:column;overflow:hidden}
.drawer-head{display:flex;align-items:center;gap:12px;padding:16px 16px 4px 24px}
.kicker{flex:1;min-width:0;font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.x{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.x:hover{background:var(--halo);color:var(--fg)}
.drawer-body{flex:1;overflow-y:auto;padding:10px 24px 24px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lab{font-size:12px;color:var(--dim)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input,select{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:6px 0}
input.big{font-size:21px;font-weight:600}
textarea{width:100%;background:transparent;border:1px solid var(--hair);border-radius:18px;padding:12px 15px;resize:vertical;min-height:70px;line-height:1.5}
textarea.verbatim{min-height:300px;font-size:14px}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--fg)}
input:disabled,select:disabled,textarea:disabled{color:var(--dim);opacity:1}
.inline{display:flex;gap:12px;align-items:baseline}
.inline > input{flex:1}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--faint);border-radius:999px;padding:6px 15px;font-size:13px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--fg)}
.btn.good{border-color:var(--ok);color:var(--ok)}
.btn.bad{border-color:var(--no);color:var(--no)}
.btn.good:hover:not(:disabled),.btn.bad:hover:not(:disabled){box-shadow:0 0 0 4px var(--halo)}
a.textbtn{white-space:nowrap}
.end-row{margin-top:auto;padding-top:8px}
@media (max-width:600px){input,select,textarea{font-size:16px}input.big{font-size:21px}}

.toast{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;max-width:min(420px,calc(100% - 40px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:18px;font-size:13px}
</style>

    });
    var cur = lead.memberId + '|' + (lead.panelId || '');
    if (!assign.some(function (g) { return g.options.some(function (o) { return o[0] === cur; }); })) assign.unshift([cur, 'Unassigned']);
    return sheet('Lead', [
      textField('f-name', 'Name', f('name').get, f('name').set, { bare: true, cls: 'big' }),
      h('div', { class: 'pair' },
        textField('f-company', 'Company', f('company').get, f('company').set, { bare: true }),
        textField('f-role', 'Role', f('role').get, f('role').set, { bare: true })),
      h('div', { class: 'field' }, h('label', { for: 'f-linkedin', text: 'LinkedIn' }), h('div', { class: 'inline' }, liInput, link)),
      textField('f-interests', 'Interests', f('interests').get, f('interests').set, { area: true, rows: 3 }),
      textField('f-hobbies', 'Hobbies', f('hobbies').get, f('hobbies').set, { area: true, rows: 3 }),
      h('div', { class: 'pair' },
        selectField('f-outcome', 'Status', OUTCOMES, lead.outcome || 'open', function (v) { setOutcome(id, v); }),
        selectField('f-assign', 'Panel', assign, cur, function (v) {
          var parts = v.split('|');
          patchDoc('leads', id, { memberId: parts[0], panelId: parts[1] || '' });
        })),
      S.canWrite ? h('div', { class: 'end-row' }, confirmBtn('Delete lead', 'Click again to delete this lead', function () { deleteLead(id); })) : null
    ]);
  }
  function stepDrawer(id, lead, stepId) {
    var a = analyse(lead), it = null;
    a.items.forEach(function (x) { if (x.s.id === stepId) it = x; });
    if (!it) return null;
    var s = it.s, inbound = s.type === 'response';
    var get = function (k) { return function () {
      var l = S.leads.get(id), st = l && (l.steps || []).filter(function (x) { return x.id === stepId; })[0];
      return (st && st[k]) || '';
    }; };
    var set = function (k) { return function (v) { var p = {}; p[k] = v; patchStep(id, stepId, p); }; };
    return sheet(it.label + DOT + (lead.name || 'New lead'), [
      h('div', { class: 'pair' },
        textField('f-date', 'Date', get('date'), set('date'), { type: 'date' }),
        selectField('f-type', 'Direction', [['contact', 'Sent by us'], ['response', 'Their response']], inbound ? 'response' : 'contact', function (v) { S.drawerForce = true; set('type')(v); })),
      inbound ? selectField('f-status', 'Where they stand', STATUSES, s.status || '', function (v) { S.drawerForce = true; set('status')(v); }) : null,
      textField('f-body', inbound ? 'Paste their reply here, word for word' : 'Paste the email you sent here, word for word', get('body'), set('body'), { area: true, bare: true, cls: 'verbatim' }),
      S.canWrite ? h('div', { class: 'end-row' }, confirmBtn('Delete this step', 'Click again to delete this step', function () { deleteStep(id, stepId); })) : null
    ]);
  }
  function tailDrawer(id, lead) {
    var a = analyse(lead), note = leadField(id, 'nextNote');
    var explain = {
      ok: 'Confirmed.',
      no: lead.outcome === 'declined' ? 'Declined. This flow ends here.' : 'No response. This flow ends here.',
      todo: a.last ? 'They replied and nothing has gone back yet. Your move.' : 'Nothing has been sent yet.',
      wait: 'Waiting on a reply' + (a.last && a.last.date ? ' since ' + fmtDate(a.last.date) : '') + '.'
    }[a.state];
    var btn = function (label, fn, cls) { return h('button', { type: 'button', class: 'btn ' + (cls || ''), onclick: fn }, label); };
    var acts = [];
    if (S.canWrite) {
      if (a.state === 'wait') {
        acts.push(btn('They replied', function () { addStep(id, 'response'); }));
        acts.push(btn('Sent a follow-up', function () { addStep(id, 'contact'); }));
        acts.push(btn('No response', function () { setOutcome(id, 'noresponse'); }, 'bad'));
      } else if (a.state === 'todo') {
        acts.push(btn('Sent ' + ord(a.contacts + 1) + ' contact', function () { addStep(id, 'contact'); }));
        if (a.contacts) acts.push(btn('They replied again', function () { addStep(id, 'response'); }));
      }
      if (a.state === 'todo' || a.state === 'wait') {
        acts.push(btn('Confirmed', function () { setOutcome(id, 'confirmed'); }, 'good'));
        acts.push(btn('Declined', function () { setOutcome(id, 'declined'); }, 'bad'));
      } else acts.push(btn('Reopen', function () { setOutcome(id, 'open'); }));
    }
    return sheet('Next' + DOT + (lead.name || 'New lead'), [
      h('p', { class: 'dim', text: explain }),
      textField('f-note', 'Note to self: what needs to be sent or said next', note.get, note.set, { area: true, bare: true, rows: 5 }),
      acts.length ? h('div', { class: 'actions' }, acts) : null
    ]);
  }
  function memberDrawer(id) {
    var n = leadList(id).length;
    var name = {
      get: function () { var x = S.members.get(id); return (x && x.name) || ''; },
      set: function (v) { patchDoc('members', id, { name: v }); }
    };
    return sheet('Team member', [
      textField('f-mname', 'Name', name.get, name.set, { bare: true, cls: 'big' }),
      S.canWrite ? h('div', { class: 'end-row' }, confirmBtn('Delete person',
        n ? 'Click again to delete them and their ' + n + (n === 1 ? ' lead' : ' leads') : 'Click again to delete', function () { deleteMember(id); })) : null
    ]);
  }
  function panelDrawer(memberId, m, panelId) {
    var p = (m.panels || []).filter(function (x) { return x.id === panelId; })[0];
    if (!p) return null;
    var n = leadList(memberId, panelId).length;
    var get = function () {
      var x = S.members.get(memberId), pp = x && (x.panels || []).filter(function (q) { return q.id === panelId; })[0];
      return (pp && pp.name) || '';
    };
    return sheet('Panel' + DOT + (m.name || 'New person'), [
      textField('f-pname', 'Panel name', get, function (v) { renamePanel(memberId, panelId, v); }, { bare: true, cls: 'big' }),
      !S.canWrite ? null : n
        ? h('p', { class: 'dim end-row', text: 'Move or delete its ' + n + (n === 1 ? ' lead' : ' leads') + ' to remove this panel.' })
        : h('div', { class: 'end-row' }, confirmBtn('Remove panel', 'Click again to remove', function () { removePanel(memberId, panelId); }))
    ]);
  }
  function drawerContent(d) {
    if (d.kind === 'member' || d.kind === 'panel') {
      var m = S.members.get(d.memberId);
      if (!m) return null;
      return d.kind === 'member' ? memberDrawer(d.memberId) : panelDrawer(d.memberId, m, d.panelId);
    }
    var lead = S.leads.get(d.leadId);
    if (!lead) return null;
    if (d.kind === 'lead') return leadDrawer(d.leadId, lead);
    if (d.kind === 'step') return stepDrawer(d.leadId, lead, d.stepId);
    return tailDrawer(d.leadId, lead);
  }
  function renderDrawer(force) {
    var el = $('#drawer'), d = S.drawer;
    document.body.classList.toggle('has-drawer', !!d);
    if (!d) { el.hidden = true; el.replaceChildren(); el.removeAttribute('data-sig'); return; }
    var sig = [d.kind, d.leadId || '', d.stepId || '', d.memberId || '', d.panelId || ''].join('|');
    var act = document.activeElement, inside = act && el.contains(act);
    var typing = inside && (act.tagName === 'INPUT' || act.tagName === 'TEXTAREA');
    if (!force && typing && el.getAttribute('data-sig') === sig) return;
    var content = drawerContent(d);
    if (!content) { S.drawer = null; return renderDrawer(true); }
    var same = el.getAttribute('data-sig') === sig;
    var keepId = inside && same ? act.id : null;
    var oldBody = $('.drawer-body', el), top = oldBody && same ? oldBody.scrollTop : 0;
    el.hidden = false; el.setAttribute('data-sig', sig);
    el.replaceChildren.apply(el, content);
    $('.drawer-body', el).scrollTop = top;
    var target = d.focus || keepId;
    d.focus = null;
    if (target) { var f = document.getElementById(target); if (f && !f.disabled) f.focus(); }
  }

  /* ---------- render ---------- */
  function render() {
    var main = $('#main'), sc = $('.scroller', main), left = sc ? sc.scrollLeft : 0, key = main.getAttribute('data-view');
    var content = viewContent();
    var now = S.view.name + (S.view.memberId || '');
    $('#v-team').setAttribute('aria-pressed', String(S.view.name === 'team'));
    $('#v-all').setAttribute('aria-pressed', String(S.view.name === 'all'));
    $('#status').textContent = S.mode === 'local' ? 'Local copy, saved in this browser only' : S.mode === 'shared' && S.ready && !S.canWrite ? 'View only' : '';
    main.setAttribute('data-view', now);
    main.replaceChildren.apply(main, content);
    var force = S.drawerForce; S.drawerForce = false;
    renderDrawer(force);
    sc = $('.scroller', main);
    if (sc && key === now) sc.scrollLeft = left;
    drawWires();
  }

  /* ---------- boot ---------- */
  function subscribe() {
    var got = { members: false, leads: false };
    var dead = function () { if (!S.ready) { S.mode = 'offline'; S.canWrite = false; } else toast('Live updates stopped. Reload the page to reconnect.'); render(); };
    ['members', 'leads'].forEach(function (coll) {
      db.collection(coll).limit(1000).onSnapshot(function (snap) {
        S[coll] = snapToMap(snap);
        got[coll] = true;
        if (got.members && got.leads) S.ready = true;
        render();
      }, dead);
    });
  }
  function boot() {
    loadPrefs();
    $('#v-team').addEventListener('click', function () { setView({ name: 'team' }); });
    $('#v-all').addEventListener('click', function () { setView({ name: 'all' }); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.drawer) closeDrawer(); });
    window.addEventListener('resize', drawWires);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWires);
    if (window.ResizeObserver) new ResizeObserver(drawWires).observe($('#main'));
    if (!window.claude || typeof window.claude.use !== 'function') {
      S.mode = 'local'; loadLocal(); render(); return;
    }
    render();
    Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function (r) {
      if (!r[0]) { S.mode = 'offline'; S.canWrite = false; render(); return; }
      db = r[0]; S.mode = 'shared';
      var ask = r[1] ? r[1].can('data.write') : Promise.resolve(null);
      return ask.then(function (can) {
        S.canKnown = can;
        if (can === false) S.canWrite = false;
        subscribe(); render();
      });
    }).catch(function () { S.mode = 'offline'; S.canWrite = false; render(); });
  }
  boot();
})();
</script>
</body>
</html>
